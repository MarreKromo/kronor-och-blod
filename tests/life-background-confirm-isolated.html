<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3H.12.7 E – bekräftelsetest</title>
<style>body{background:#151a17;color:#f2e7ce;font:16px system-ui;padding:18px;max-width:700px;margin:auto}button{padding:12px;background:#8e412e;color:white;border:1px solid #e0bd73;border-radius:6px}pre{white-space:pre-wrap;line-height:1.6}</style>
<h1>Livsbakgrund – bekräftelsetest</h1>
<p>Separat test med simulerad lagring. Testet skriver aldrig till spelets localStorage och aktiverar inte sparning.</p>
<button id="run">Kör bekräftelsetester</button><pre id="out" role="status">Inte körda.</pre>
<script>
document.getElementById('run').onclick=async function(){
 const out=document.getElementById('out');out.textContent='Laddar testmoduler…';
 try{
  const paths=['../src/life-background-model.js','../src/life-background-confirm.js'];
  const scripts=await Promise.all(paths.map(async p=>{const r=await fetch(p+'?v=03127e',{cache:'no-store'});if(!r.ok)throw Error('Saknar '+p);return r.text()}));
  const frame=document.createElement('iframe');frame.sandbox='allow-scripts';frame.hidden=true;document.body.append(frame);
  const token='confirm-'+Math.random();
  const result=new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>reject(Error('Testet svarade inte.')),10000);
   function receive(e){if(e.source!==frame.contentWindow||!e.data||e.data.token!==token)return;clearTimeout(timer);window.removeEventListener('message',receive);resolve(e.data.lines)}
   window.addEventListener('message',receive);
  });
  frame.srcdoc=`<!doctype html><script>
window.addEventListener('message',function(event){
 const {token,scripts}=event.data, lines=[];
 const base='kronor-och-blod.',id='11111111-1111-4111-8111-111111111111',other='22222222-2222-4222-8222-222222222222';
 let map=new Map(),active=id,writes=0;
 const storage={getItem:k=>map.has(k)?map.get(k):null,setItem:(k,v)=>{writes++;map.set(k,String(v))},removeItem:k=>{writes++;map.delete(k)}};
 const c={version:1,name:'Testperson',background:'bonde',placeId:'VG-SKARA-001',attributes:{styrka:3,list:1,anseende:1}},raw=JSON.stringify(c);
 const w={};const character={get:()=>({name:'Testperson',characterId:active})};
 function reset(){map=new Map();writes=0;active=id;map.set(base+'character.v1',raw);map.set(base+'character.identity.v1',JSON.stringify({version:1,characterId:id,characterRaw:raw}));}
 function check(v,msg){if(!v)throw Error(msg)}
 function denied(fn){let failed=false;try{fn()}catch(_){failed=true}check(failed,'Borde ha blockerats')}
 function test(name,fn){try{reset();const gate=w.KB_LIFE_BACKGROUND_CONFIRM.create({storage,character,model:w.KB_LIFE_BACKGROUND_MODEL});fn(gate);check(writes===0,'Testmodulen skrev till lagring');lines.push('PASS '+name)}catch(e){lines.push('FAIL '+name+': '+e.message)}}
 try{
 new Function('window',scripts[0])(w);new Function('window',scripts[1])(w);
 const value={version:1,upbringing:'farm',familySituation:'together',past:'ordinary',ambition:'farmstead',biography:''};
 test('Förhandsgranska och bekräfta kräver två steg',g=>{denied(()=>g.approve(value));check(g.prepare(value).ok,'Förberedelse');check(g.approve(value).ok,'Bekräftelse')});
 test('Avbryt tar bort bekräftelsen',g=>{g.prepare(value);g.cancel();denied(()=>g.approve(value))});
 test('Ändrade val kräver ny granskning',g=>{g.prepare(value);denied(()=>g.approve({...value,ambition:'trade'}));denied(()=>g.approve(value))});
 test('Karaktärsbyte blockerar bekräftelse',g=>{g.prepare(value);active=other;denied(()=>g.approve(value))});
 test('Fel ägaridentitet blockerar',g=>{g.prepare(value);map.set(base+'character.identity.v1','{}');denied(()=>g.approve(value))});
 test('Pågående bytesjournal blockerar',g=>{g.prepare(value);map.set(base+'switch.journal.v1','{}');denied(()=>g.approve(value))});
 test('Pågående skrivjournal blockerar',g=>{g.prepare(value);map.set(base+'life-background.write-journal.v1','{}');denied(()=>g.approve(value))});
 test('Befintlig livsbakgrund nekas',g=>{const data=JSON.stringify(value);map.set(base+'life-background.v1',data);map.set(base+'life-background.owner.v1',JSON.stringify({version:1,characterId:id,backgroundRaw:data}));denied(()=>g.prepare(value))});
 test('Ofullständigt ägarpar nekas',g=>{map.set(base+'life-background.v1','{}');denied(()=>g.prepare(value))});
 test('Ogiltiga val nekas',g=>denied(()=>g.prepare({...value,past:'invalid'})));
 test('Bekräftelse kan bara användas en gång',g=>{g.prepare(value);g.approve(value);denied(()=>g.approve(value))});
 }catch(e){lines.push('FAIL Testmiljö: '+e.message)}
 parent.postMessage({token,lines},'*');
});<\/script>`;
  await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  frame.contentWindow.postMessage({token,scripts},'*');
  const lines=await result;
  out.textContent=lines.join('\n')+'\n\n'+lines.filter(s=>s.startsWith('PASS')).length+'/'+lines.length+' PASS';
  frame.remove();
 }catch(e){out.textContent='TEST FEL: '+e.message}
};
</script></html>
