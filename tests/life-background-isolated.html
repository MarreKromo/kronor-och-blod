<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3H.12.6 C – isolerat test</title><style>body{background:#151a17;color:#f2e7ce;font:16px system-ui;padding:18px;max-width:650px;margin:auto}button{padding:14px;background:#8e412e;color:white;border:1px solid #e0bd73;border-radius:6px}pre{white-space:pre-wrap;line-height:1.7}</style><h1>Livsbakgrund – isolerat test</h1><p>Testar riktiga spelmoduler mot en minnesbaserad låtsaslagring. Dina riktiga karaktärer och Safari-sparningar berörs inte.</p><button id="run">Kör isolerade tester</button><pre id="out" role="status">Inte körda.</pre><script>
const output=document.getElementById('out');
document.getElementById('run').onclick=async()=>{
 output.textContent='Läser spelmoduler…';
 try{
 const files=await Promise.all(['../src/life-background-model.js','../src/life-background-save.js'].map(async p=>{let r=await fetch(p+'?test='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Kan inte läsa '+p);return r.text()}));
 const frame=document.createElement('iframe');frame.sandbox='allow-scripts';frame.hidden=true;document.body.append(frame);
 const token='kb-test-'+Math.random();
 const result=new Promise((resolve,reject)=>{let timeout=setTimeout(()=>reject(Error('Testet svarade inte.')),10000);window.addEventListener('message',function onMessage(e){if(e.source!==frame.contentWindow||!e.data||e.data.token!==token)return;clearTimeout(timeout);window.removeEventListener('message',onMessage);resolve(e.data.lines)})});
 frame.srcdoc=`<!doctype html><script>window.addEventListener('message',function(event){const {token,files}=event.data;let lines=[];const base='kronor-och-blod.';const id='11111111-1111-4111-8111-111111111111';let store=new Map();let failKey=null;const storage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>{if(k===failKey)throw Error('Simulerat skrivfel');store.set(k,String(v))},removeItem:k=>store.delete(k)};const win={};const c={version:1,name:'Testperson C',background:'bonde',placeId:'VG-SKARA-001',attributes:{styrka:3,list:1,anseende:1}};const cr=JSON.stringify(c);let active=id;win.KB_CHARACTER={get:()=>({name:c.name,characterId:active})};function reset(){store=new Map();failKey=null;active=id;storage.setItem(base+'character.v1',cr);storage.setItem(base+'character.identity.v1',JSON.stringify({version:1,characterId:id,characterRaw:cr}))}function test(name,fn){try{reset();fn();lines.push('PASS '+name)}catch(e){lines.push('FAIL '+name+': '+e.message)}}function expect(v,m){if(!v)throw Error(m)}function denied(fn){let yes=false;try{fn()}catch(_){yes=true}expect(yes,'Skulle ha nekats')}try{new Function('window','localStorage',files[0])(win,storage);new Function('window','localStorage',files[1])(win,storage);const api=win.KB_LIFE_BACKGROUND_SAVE;const value={version:1,upbringing:'farm',familySituation:'together',past:'ordinary',ambition:'farmstead',biography:''};test('Äldre karaktär utan livsbakgrund',()=>expect(api.inspect().exists===false,'Fel'));test('Explicit sparning på testkaraktär',()=>{expect(api.save(value).ok,'Sparning misslyckades');expect(api.inspect().exists,'Saknas')});test('Fel karaktärs-ID stoppas',()=>{active='22222222-2222-4222-8222-222222222222';denied(()=>api.save(value));expect(!store.has(base+'life-background.v1'),'Oväntad skrivning')});test('Ogiltigt formulär stoppas',()=>{denied(()=>api.save({...value,upbringing:'wrong'}));expect(!store.has(base+'life-background.v1'),'Oväntad skrivning')});test('Ofullständigt ägarpar stoppas',()=>{storage.setItem(base+'life-background.v1','{}');denied(()=>api.save(value));expect(!store.has(base+'life-background.write-journal.v1'),'Oväntad journal')});test('Simulerat skrivfel återställs',()=>{failKey=base+'life-background.owner.v1';denied(()=>api.save(value));expect(!store.has(base+'life-background.v1'),'Data kvar efter fel');expect(!store.has(base+'life-background.write-journal.v1'),'Journal kvar efter fel')});test('Dubbel sparning nekas',()=>{api.save(value);denied(()=>api.save(value))});test('Oavslutad bytesjournal stoppar',()=>{storage.setItem(base+'switch.journal.v1','{}');denied(()=>api.save(value));expect(!store.has(base+'life-background.v1'),'Oväntad skrivning')});}catch(e){lines.push('FEL Testmiljön: '+e.message)}parent.postMessage({token,lines},'*')});<\/script>`;
 await new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.contentWindow.postMessage({token,files},'*');
 const lines=await result;output.textContent=lines.join('\n')+'\n\n'+lines.filter(x=>x.startsWith('PASS')).length+'/'+lines.length+' PASS';frame.remove();
 }catch(e){output.textContent='TEST FEL: '+e.message}
};
</script></html>
