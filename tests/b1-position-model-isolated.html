<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB-B1.2 – isolerade tester</title><style>body{background:#18211c;color:#f0e4c9;font:18px system-ui;padding:22px;line-height:1.65}h1{font-size:28px}.ok{color:#99e0ad}.bad{color:#ff9a9a}</style></head><body><h1>KB-B1.2 – Positionsmodell</h1><div id="results">Testar…</div><script src="../src/places.js"></script><script src="../src/b1-position-model.js?v=b12-1"></script><script>
(function(){'use strict';const m=window.KB_B1_POSITION_MODEL,id='11111111-1111-4111-8111-111111111111',other='22222222-2222-4222-8222-222222222222',key='kronor-och-blod.character.v1',ik='kronor-och-blod.character.identity.v1';let count=0,pass=0;const rows=[];function test(name,fn){count++;let ok=false;try{ok=fn()===true}catch(_){}if(ok)pass++;rows.push('<div class="'+(ok?'ok':'bad')+'">'+count+'. '+(ok?'PASS':'FAIL')+' – '+name+'</div>');}function memory(){const data={};const raw=JSON.stringify({version:1,name:'Testbonde',background:'bonde',placeId:m.START});data[key]=raw;data[ik]=JSON.stringify({version:1,characterId:id,characterRaw:raw});return {data,getItem:k=>Object.prototype.hasOwnProperty.call(data,k)?data[k]:null,setItem(){throw Error('Otillåten skrivning');},removeItem(){throw Error('Otillåten radering');}};}
 test('Verifierad aktiv karaktär',()=>m.inspect(memory()).ok);
 test('Ingen karaktär stoppas',()=>!m.inspect({getItem:()=>null}).ok);
 test('Manipulerad identitet stoppas',()=>{const s=memory();s.data[ik]=JSON.stringify({version:1,characterId:id,characterRaw:'fel'});return !m.inspect(s).ok});
 test('Skara är säker äldre startposition',()=>m.inspect(memory()).placeId===m.START);
 test('Skara till Varnhem förhandsvisas',()=>m.route(m.START,'VG-VARNHEM-003').days===1);
 test('Otillåten väg stoppas',()=>!m.route(m.START,'VG-LODOSE-002').ok);
 test('Samma plats stoppas',()=>!m.route(m.START,m.START).ok);
 test('Ogiltig plats stoppas',()=>!m.route(m.START,'FEL').ok);
 test('Positionspost med rätt ägare godkänns',()=>m.validateRecord({version:1,characterId:id,placeId:m.START,revision:0},id).ok);
 test('Annan karaktärs position stoppas',()=>!m.validateRecord({version:1,characterId:id,placeId:m.START,revision:0},other).ok);
 test('Skadad position stoppas',()=>!m.validateRecord({version:1,characterId:id,placeId:'FEL',revision:0},id).ok);
 test('Läsning skriver aldrig i lagring',()=>{const s=memory(),before=JSON.stringify(s.data);m.inspect(s);m.route(m.START,'VG-VARNHEM-003');return before===JSON.stringify(s.data)});
 document.getElementById('results').innerHTML='<strong>'+pass+'/'+count+' PASS</strong><p>Endast minneslagring. Ingen riktig resa eller sparning.</p>'+rows.join('');})();
</script></body></html>
