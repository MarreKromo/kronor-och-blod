<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB-B1.1 – isolerade tester</title><style>body{background:#18231c;color:#f4ead5;font:16px system-ui;padding:20px}li{margin:12px 0}.ok{color:#8ee0a4}.bad{color:#ff9797}</style></head><body><h1>KB-B1.1 – Säkerhetstest</h1><p id="summary"></p><ol id="results"></ol><script src="../src/places.js"></script><script src="../src/b1-position-preview.js?v=b11"></script><script>const M=window.KB_B1_POSITION_PREVIEW,P=window.KB_PLACES,B='kronor-och-blod.',id='12345678-1234-1234-1234-123456789abc';const cr=JSON.stringify({version:1,name:'Isolerad testperson',background:'bonde',placeId:'VG-SKARA-001'});function storage(entries){const data={...entries},before=JSON.stringify(data);return {getItem(k){return Object.prototype.hasOwnProperty.call(data,k)?data[k]:null},setItem(){throw Error('OTILLÅTEN SKRIVNING')},removeItem(){throw Error('OTILLÅTEN RADERING')},unchanged(){return before===JSON.stringify(data)}}}const good=()=>storage({[B+'character.v1']:cr,[B+'character.identity.v1']:JSON.stringify({version:1,characterId:id,characterRaw:cr})});const tests=[['Verifierad aktiv karaktär',()=>M.inspect(good(),P).ok],['Ingen karaktär stoppas',()=>!M.inspect(storage({}),P).ok],['Manipulerad identitet stoppas',()=>!M.inspect(storage({[B+'character.v1']:cr,[B+'character.identity.v1']:JSON.stringify({version:1,characterId:id,characterRaw:'annan'})}),P).ok],['Skara → Varnhem förhandsvisas',()=>M.route('VG-SKARA-001','VG-VARNHEM-003',P).ok],['Övrig väg är spärrad',()=>!M.route('VG-SKARA-001','VG-LODOSE-002',P).ok],['Samma plats är inte resa',()=>!M.route('VG-SKARA-001','VG-SKARA-001',P).ok],['Ogiltigt plats-ID stoppas',()=>!M.route('VG-SKARA-001','saknas',P).ok],['Läsning ändrar inga sparningar',()=>{const s=good();M.inspect(s,P);M.route('VG-SKARA-001','VG-VARNHEM-003',P);return s.unchanged()}]];let passed=0;for(const [name,fn] of tests){let ok=false;try{ok=!!fn()}catch(_){}if(ok)passed++;const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'PASS – ':'FAIL – ')+name;document.getElementById('results').append(li)}document.getElementById('summary').textContent=passed+'/'+tests.length+' PASS. Isolerad minneslagring – ingen riktig import eller resa.';</script></body></html>
