<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3H.12.7 C – identitetstest</title><style>body{background:#151a17;color:#f2e7ce;font:16px system-ui;padding:18px}button{padding:12px;margin:5px;background:#8e412e;color:white;border:1px solid #e0bd73}pre{white-space:pre-wrap}</style><h1>Livsbakgrund – identitetstest</h1><p>Separat testmiljö utan koppling till dina sparningar.</p><button id="run">Kör identitetstester</button><pre id="out">Inte körda.</pre><script>
const out=document.getElementById('out');
document.getElementById('run').onclick=async()=>{
 const uuid='11111111-1111-4111-8111-111111111111';
 const source=await (await fetch('../src/life-background-identity-guard.js?v=03127c')).text();
 const token='kb-test-'+Math.random().toString(36).slice(2);
 const frame=document.createElement('iframe');frame.style.display='none';document.body.appendChild(frame);
 const html=`<!doctype html><html><body><details id="kb-life-profile-entry"><div class="kb-life-form-mount"><section id="kb-life-background-form"><form><input value="abc"><button type="submit">Preview</button></form><div class="kb-life-preview"></div></section></div></details><script>
const mem=new Map();const base='kronor-och-blod.';const uuid=${JSON.stringify(uuid)};const raw=JSON.stringify({version:1,name:'Testperson'});mem.set(base+'character.v1',raw);mem.set(base+'character.identity.v1',JSON.stringify({version:1,characterId:uuid,characterRaw:raw}));Object.defineProperty(window,'localStorage',{value:{getItem:k=>mem.has(k)?mem.get(k):null,setItem:()=>{throw Error('Write attempted')},removeItem:()=>{throw Error('Remove attempted')}}});let active={name:'Testperson',characterId:uuid};window.KB_CHARACTER={get:()=>active};window.addEventListener('message',e=>{if(e.data!=='${token}')return;let results=[];function test(name,fn){try{if(!fn())throw Error('unexpected');results.push('PASS '+name)}catch(err){results.push('FAIL '+name+': '+err.message)}};let script=document.createElement('script');script.textContent=parent.__kb_guard_source;document.body.appendChild(script);const root=document.getElementById('kb-life-profile-entry'),form=document.querySelector('form');function submit(){return form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}test('Korrekt aktiv karaktär tillåts',()=>submit()===true);active={name:'Annan',characterId:'22222222-2222-4222-8222-222222222222'};test('Karaktärsbyte stoppar förhandsgranskning',()=>submit()===false&&!root.open);active={name:'Testperson',characterId:uuid};mem.set(base+'character.identity.v1','{}');test('Fel ägaridentitet stoppas',()=>submit()===false);mem.set(base+'character.identity.v1',JSON.stringify({version:1,characterId:uuid,characterRaw:raw}));mem.set(base+'switch.journal.v1','{}');test('Pågående byte stoppar',()=>submit()===false);mem.delete(base+'switch.journal.v1');mem.set(base+'life-background.write-journal.v1','{}');test('Pågående sparning stoppar',()=>submit()===false);parent.postMessage({token:'${token}',results},'*')});<\/script></body></html>`;
 window.__kb_guard_source=source;
 const result=new Promise(resolve=>{const handler=e=>{if(e.data?.token!==token)return;window.removeEventListener('message',handler);resolve(e.data.results)};window.addEventListener('message',handler)});
 frame.srcdoc=html;await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.contentWindow.postMessage(token,'*');const lines=await result;out.textContent=lines.join('\n')+'\n\n'+lines.filter(x=>x.startsWith('PASS')).length+'/'+lines.length+' PASS';frame.remove();delete window.__kb_guard_source;
};
</script></html>
